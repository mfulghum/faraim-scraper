[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faraim-scraper"
version = "0.1.0"
description = "Scrape FAR and AIM HTML pages and images from faraim.org for dataset building"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pymupdf>=1.24",
    "scikit-learn>=1.4",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
faraim-scraper = "faraim_scraper.__main__:main"

[tool.setuptools.packages.find]
include = ["faraim_scraper*"]
